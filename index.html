<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>灰空薄荷</title>
  <link rel="icon" href="assets/avatar.svg">
  <link rel="stylesheet" href="https://fonts.loli.net/css2?family=Noto+Serif+SC:wght@400;600&display=swap">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body class="landing">
  <main class="landing-hero">
    <div class="landing-inner">
      <p class="landing-hi" id="landing-hi"></p>
      <h1 class="landing-title" id="landing-title"></h1>
      <p class="landing-tagline" id="landing-tagline"></p>
      <p class="landing-welcome" id="landing-welcome"></p>
      <a class="landing-enter" href="moments.html">进入博客 →</a>
    </div>
  </main>

  <script src="data/config.js"></script>
  <script src="assets/main.js"></script>
  <script>
    const cfg = window.SITE_CONFIG || {};
    document.getElementById("landing-hi").textContent = cfg.greeting || "你好，欢迎来到";
    document.getElementById("landing-title").textContent = cfg.siteName || "灰空薄荷";
    document.getElementById("landing-tagline").textContent = cfg.tagline || "";
    document.getElementById("landing-welcome").textContent = cfg.welcome || "";
  </script>
</body>
</html>
