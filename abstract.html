<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>灰空薄荷 · 抽象</title>
  <link rel="icon" href="assets/avatar.svg">
  <link rel="stylesheet" href="https://fonts.loli.net/css2?family=Noto+Serif+SC:wght@400;600&display=swap">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <header class="site-header" id="site-header"></header>

  <main class="container">
    <div class="page-banner">
      <h1>抽象</h1>
      <p>从网上捡回来的零碎，抽到哪条算哪条，内容不代表本人观点</p>
    </div>

    <div class="card draw-card">
      <div class="draw-stage" id="draw-stage">
        <p class="draw-hint">筒里还空着……点一下下面的按钮试试</p>
      </div>
      <div class="draw-actions">
        <button class="draw-btn" id="draw-btn">来一条</button>
      </div>
    </div>
  </main>

  <footer class="site-footer" id="site-footer"></footer>

  <script src="data/config.js"></script>
  <script src="data/abstract.js"></script>
  <script src="assets/main.js"></script>
  <script>
    renderHeader("abstract");
    renderFooter();
    initRandomDraw(
      document.getElementById("draw-btn"),
      document.getElementById("draw-stage"),
      window.ABSTRACT_LINES || [],
      "这里还空着。去 data/abstract.js 里贴几条吧。"
    );
  </script>
</body>
</html>
