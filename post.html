<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>灰空薄荷 · 文章</title>
  <link rel="icon" href="assets/avatar.svg">
  <link rel="stylesheet" href="https://fonts.loli.net/css2?family=Noto+Serif+SC:wght@400;600&display=swap">
  <link rel="stylesheet" href="assets/style.css">
  <!-- ========== 第 1 处：插入 KaTeX 样式 ========== -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
</head>
<body>
  <header class="site-header" id="site-header"></header>

  <main class="container">
    <a class="back-link" href="posts.html">← 返回文章列表</a>
    <article class="card">
      <div class="page-banner" style="margin-bottom:14px;">
        <h1 id="post-title">加载中……</h1>
        <p id="post-date"></p>
      </div>
      <div class="post-content" id="post-content"></div>
    </article>
    <div class="card">
      <div id="comments"></div>
    </div>
  </main>

  <footer class="site-footer" id="site-footer"></footer>

  <script src="https://fastly.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="data/config.js"></script>
  <script src="data/posts.js"></script>
  <script src="data/tech.js"></script>
  <script src="data/study.js"></script>
  <script src="data/problems.js"></script>
  <script src="assets/main.js"></script>
  <!-- ========== 第 2 处：插入 KaTeX 脚本 ========== -->
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
  <script>
    renderHeader("posts");
    renderFooter();

    const SECTIONS = [
      { list: window.POSTS || [], dir: "posts", back: "posts.html", backLabel: "文章" },
      { list: window.TECH_POSTS || [], dir: "tech-posts", back: "tech.html", backLabel: "技术" },
      { list: window.STUDY_POSTS || [], dir: "study-posts", back: "study.html", backLabel: "学习" },
      { list: window.PROBLEM_POSTS || [], dir: "problem-posts", back: "problems.html", backLabel: "题目" },
    ];

    const slug = new URLSearchParams(location.search).get("p");
    let meta = null, section = null;
    for (const s of SECTIONS) {
      const found = s.list.find((p) => p.slug === slug);
      if (found) { meta = found; section = s; break; }
    }

    if (!slug || !meta) {
      document.getElementById("post-title").textContent = "找不到这篇文章";
      document.getElementById("post-content").innerHTML =
        "<p>也许它被风吹走了……回到 <a href='posts.html'>文章列表</a> 看看吧。</p>";
    } else {
      document.title = meta.title + " · 灰空薄荷";
      document.getElementById("post-title").textContent = meta.title;
      document.getElementById("post-date").textContent = meta.date;
      document.querySelector(".back-link").textContent = "← 返回" + section.backLabel;
      document.querySelector(".back-link").href = section.back;
      fetch(section.dir + "/" + encodeURIComponent(slug) + ".md")
        .then((r) => {
          if (!r.ok) throw new Error("404");
          return r.text();
        })
        .then((md) => {
          document.getElementById("post-content").innerHTML = marked.parse(md);
          // ========== 第 3 处：marked 完成后，KaTeX 渲染公式 ==========
          renderMathInElement(document.getElementById("post-content"), {
            delimiters: [
              {left: "$$", right: "$$", display: true},
              {left: "$", right: "$", display: false}
            ],
            throwOnError: false
          });
          loadGiscus(document.getElementById("comments"), "post-" + slug);
        })
        .catch(() => {
          document.getElementById("post-content").innerHTML =
            "<p>文章文件加载失败了……检查 " + section.dir + "/" + slug + ".md 是否存在。</p>";
        });
    }
  </script>
</body>
</html>
